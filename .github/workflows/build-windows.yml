name: Windows-Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Noetig, damit der Workflow die ZIP an das GitHub-Release anhaengen darf
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Abhaengigkeiten installieren
        run: uv sync --group build

      - name: Build mit PyInstaller
        run: uv run pyinstaller --noconsole --onedir --name JohannaAssistenten main.py

      - name: ZIP erstellen
        run: Compress-Archive -Path dist/JohannaAssistenten -DestinationPath JohannaAssistenten-windows.zip

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: JohannaAssistenten-windows
          path: JohannaAssistenten-windows.zip

      - name: An Release anhaengen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JohannaAssistenten-windows.zip
