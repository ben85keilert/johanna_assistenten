name: Windows-Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Noetig, damit der Workflow die ZIP an das GitHub-Release anhaengen darf
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Abhaengigkeiten installieren
        run: uv sync --group build

      # Der automatische Updater vergleicht den Release-Tag mit
      # version.__version__ - ein falscher Tag wuerde Endlos-Updates oder
      # nie angebotene Updates bedeuten, deshalb hier der harte Abgleich
      - name: Version pruefen (Tag == version.py)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = uv run python -c "import version; print(version.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} passt nicht zu version.py (v$v)"
          }

      - name: Build mit PyInstaller
        run: uv run pyinstaller --noconsole --onedir --name JohannaAssistenten main.py

      # Achtung: Ordner- und ZIP-Name sind Teil des Update-Vertrags -
      # updater.py sucht im Release genau das Asset
      # "JohannaAssistenten-windows.zip" mit dem Ordner "JohannaAssistenten"
      # darin. Nicht umbenennen!
      - name: ZIP erstellen
        run: Compress-Archive -Path dist/JohannaAssistenten -DestinationPath JohannaAssistenten-windows.zip

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: JohannaAssistenten-windows
          path: JohannaAssistenten-windows.zip

      - name: An Release anhaengen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JohannaAssistenten-windows.zip
