[project]
name = "johanna-assistenten"
# Muss mit version.py uebereinstimmen (Release-Checkliste im README)
version = "0.3.1"
description = "PySide6-Dienstplan-App: faire Verteilung der Assistenzdienste eines Monats"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # <6.9: Qt >=6.9 braucht eine neuere MSVC-Runtime, als z. B. Anaconda mitbringt
    "PySide6>=6.6,<6.9",
    "openpyxl>=3.1.2",
    "reportlab>=4.1.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.0",
]
